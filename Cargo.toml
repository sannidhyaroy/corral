[package]
name = "corral"
version = "0.1.0"
edition = "2024"
description = "A home on the range, where the llamas can play."
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
flate2 = "1.1.10"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
libc = "0.2.190"
ring = "0.17.14"
serde_json = "1.0.151"
tokio = { version = "1.53.2", default-features = false, features = ["rt", "net", "time", "macros"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
