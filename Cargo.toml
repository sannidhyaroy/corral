[package]
name = "corral"
version = "0.1.0"
edition = "2024"
description = "A home on the range, where the llamas can play."
license = "AGPL-3.0-or-later"
readme = "README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
