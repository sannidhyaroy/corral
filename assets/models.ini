# The models llama.cpp's router serves, one [section] per preset; the keys are llama-server options without the
# leading dashes. Apps pick a preset by its section name. [*] holds defaults for every preset.
# See llama.cpp's documentation on router mode (`--models-preset`) for every option.

[*]
n-gpu-layers = 99
ctx-size = 32768

# [my-model]
# alias = My Model
# model = /path/to/model.gguf
