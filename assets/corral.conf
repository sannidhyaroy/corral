# Corral's settings. One `key = value` per line; `#` starts a comment.
# After changing ports, `listen`, `name`, `name_listen`, `models_max` or `router_options`, run `corral install`
# again so the systemd units match.

# Where apps reach Corral (24937 is 0x6169, the bytes of "ai"), and llama.cpp's router on this machine.
# gate_port = 24937
# router_port = 18080

# `local` (default): only this machine can reach the gate. `all`: every network the firewall allows; other devices
# then need an API key from `corral key add <device>`.
# listen = local

# Addresses or ranges treated like this machine: no key needed, the router's tools allowed. Safe for Tailscale
# (100.64.0.0/10), whose addresses belong to each device's key; not for a home Wi-Fi, which anyone joining shares.
# trusted =

# How many models the router keeps loaded at once, and extra llama-server options for the router
# (`llama-server --help` lists them all; `--tools` lists the tools the web UI's models may use).
# models_max = 1
# router_options = --tools get_datetime

# Presets that need the whole GPU (IDs from models.ini, comma-separated): helpers step aside while one loads.
# exclusive =

# The guard's GPU memory limits in GiB: a warning, then the model is unloaded. Default: 90% and 95% of the total.
# gpu_warn =
# gpu_unload =

# Your own HTTPS name for the web UI, such as corral.internal, with a certificate in this folder's tls/.
# name =
# name_address = 127.0.97.105
# Who reaches that name: `local` (only this machine), `armed` (other devices too, while Corral is on; they need a key
# and to trust your certificate) or `all` (always). With `armed` or `all`, Corral holds ports 80 and 443 on every
# address. Your firewall decides which networks can reach them.
# name_listen = local
