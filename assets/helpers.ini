# Helpers: small models that run beside the router in their own servers, for jobs that can't wait for the router
# to swap models (edit predictions, dictation, embeddings). One [section] per helper; run `corral install` after
# adding or removing one.
#
# type      llama (default): llama-server, other keys are its options as in models.ini
#           custom: runs `command`, with {port} replaced by the helper's internal port
# port      where clients reach it (internal port: port + 10000, or set internal-port)
# armed     yes: plain `corral on` includes it; otherwise `corral on --with <name>`
# yields    yes (default): steps aside for presets that need the whole GPU and when GPU memory runs short
# claims    gpu: the router's model is unloaded when this helper starts

# [edits]
# model = /path/to/edit-model.gguf
# ctx-size = 8192
# port = 8081
# armed = no
